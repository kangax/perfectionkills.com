<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body class="post-page">
    <div id="outer-wrapper">
      <div id="wrapper">

        {% include header.html %}

        <main id="main-content" class="content">
          <article class="post">
            <header class="post-header">
              <a href="/" class="back-to-front">&larr; All posts</a>
              <h1 class="post-title">{{ page.title }}</h1>
              {% if page.description %}<p class="post-dek">{{ page.description }}</p>{% endif %}
              <p class="post-meta">
                <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time>
              </p>
            </header>

            <div class="post-body">
              {{ content }}
            </div>

            <aside class="post-ad" aria-label="Advertisement">
              <div id="carbonads-container"></div>
            </aside>
          </article>

          <details class="post-discussion">
            <summary>Comments</summary>
            <div id="disqus_thread"></div>
            <noscript>Please enable JavaScript to view comments.</noscript>
          </details>
        </main>

      </div>
    </div>

    {% include footer.html %}

    <script src="/js/master.js"></script>
    <script src="/js/post.js"></script>

  </body>
</html>
